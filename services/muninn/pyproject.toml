[project]
name = "muninn"
version = "0.1.0"
description = "Yggdrasil — agentes de IA de triagem (Pydantic AI), gateway LLM (LiteLLM), observabilidade (Langfuse)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai>=0.0.20",
    "litellm>=1.40",
    "langfuse>=2.40",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muninn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=muninn --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true