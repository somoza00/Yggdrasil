[package]
name = "huginn"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil — ingest de eventos, parsing CEF/syslog, enriquecimento de IOC e correlação"
license = "Apache-2.0"

[dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# testes de parsing são embutidos (inline) nos módulos

[profile.release]
lto = true
strip = true