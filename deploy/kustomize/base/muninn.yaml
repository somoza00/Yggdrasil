apiVersion: apps/v1
kind: Deployment
metadata:
  name: muninn
  namespace: yggdrasil
  labels:
    app: muninn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muninn
  template:
    metadata:
      labels:
        app: muninn
    spec:
      containers:
        - name: muninn
          image: yggdrasil/muninn:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: yggdrasil-config
          env:
            - name: MUNNIN_PORT
              value: "8090"
            - name: MUNNIN_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: redis_url
            - name: MUNNIN_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: litellm_api_key
            - name: MUNNIN_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: langfuse_public_key
            - name: MUNNIN_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: langfuse_secret_key
            # JWT de serviço para o POST /api/v1/incidents do ygg-api.
            - name: YGG_API_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: ygg_api_service_token
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: muninn
  namespace: yggdrasil
  labels:
    app: muninn
spec:
  selector:
    app: muninn
  ports:
    - name: http
      port: 80
      targetPort: 8090