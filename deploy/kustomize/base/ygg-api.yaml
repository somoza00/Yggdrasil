apiVersion: apps/v1
kind: Deployment
metadata:
  name: ygg-api
  namespace: yggdrasil
  labels:
    app: ygg-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ygg-api
  template:
    metadata:
      labels:
        app: ygg-api
    spec:
      containers:
        - name: ygg-api
          image: yggdrasil/ygg-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: yggdrasil-config
          env:
            - name: YGG_API_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: database_url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yggdrasil-secrets
                  key: jwt_secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ygg-api
  namespace: yggdrasil
  labels:
    app: ygg-api
spec:
  selector:
    app: ygg-api
  ports:
    - name: http
      port: 80
      targetPort: 8080