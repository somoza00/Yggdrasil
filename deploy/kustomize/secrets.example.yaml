# EXEMPLO do Secret yggdrasil-secrets — NÃO faz parte de nenhuma kustomization.
# Segredos nunca são aplicados via kustomize (a base sobrescreveria os reais).
# NUNCA commitar valores reais. Em produção, use OpenBao / External Secrets.
#
# Crie no namespace do overlay ANTES do deploy. O token de serviço do muninn
# é um JWT assinado com o mesmo jwt_secret (validade curta = rotação frequente):
#   JWT_SECRET="$(openssl rand -hex 32)"
#   YGG_API_SERVICE_TOKEN="$(cd services/ygg-api && JWT_SECRET=$JWT_SECRET \
#     go run ./cmd/ygg-token -sub muninn -ttl 720h)"
# Depois, por exemplo:
#   kubectl -n yggdrasil-dev create secret generic yggdrasil-secrets \
#     --from-literal=database_url='postgres://USER:PASS@postgres:5432/yggdrasil' \
#     --from-literal=redis_url='redis://redis:6379' \
#     --from-literal=jwt_secret="$JWT_SECRET" \
#     --from-literal=ygg_api_service_token="$YGG_API_SERVICE_TOKEN" \
#     --from-literal=litellm_api_key='...' \
#     --from-literal=langfuse_public_key='...' \
#     --from-literal=langfuse_secret_key='...'
#
# Ou copie este arquivo para fora do repo, preencha e:
#   kubectl -n yggdrasil-dev apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: yggdrasil-secrets
type: Opaque
stringData:
  database_url: postgres://USER:PASS@postgres:5432/yggdrasil
  redis_url: redis://redis:6379
  jwt_secret: CHANGE_ME
  ygg_api_service_token: CHANGE_ME
  litellm_api_key: CHANGE_ME
  langfuse_public_key: ""
  langfuse_secret_key: ""
